name: Documentation Command Syntax

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  command-syntax:
    name: ${{ matrix.name }}
    if: github.repository_owner == 'GC-STEM'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Bash
            os: ubuntu-latest
          - name: macOS / Bash
            os: macos-latest
          - name: Windows / Git Bash
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Core CI dependencies
        run: python -m pip install --disable-pip-version-check -r .github/ci/requirements.txt
      - name: Resolve Bash executable
        run: |
          shell_path="$(command -v bash)"
          if command -v cygpath >/dev/null 2>&1; then
            shell_path="$(cygpath -w "$shell_path")"
          fi
          echo "CI_TEST_SHELL=$shell_path" >> "$GITHUB_ENV"
      - name: Check documented Bash syntax
        run: python .github/ci/check_readme_commands.py --shell bash
